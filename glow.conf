# glowd config. Edit, then: sudo systemctl reload glowd  (or restart it)
#
# mode: breathing | heartbeat | load
#   breathing - Apple-Watch style slow breath          (default)
#   heartbeat - lub-dub pulse, repeats every `period` seconds
#   load      - CPU meter: slow faint breath when idle,
#               brighter the busier the machine gets
mode = breathing

# min/max: backlight level 0-100. Low min = subtle, high max = bright.
min = 8
max = 100

# step: quantize the glow to whole steps of this many levels (1 = finest).
# Each level change that reaches the hardware makes the firmware and
# systemd (udev/logind) do a burst of work, so a bigger step = far less CPU.
# 4 is visually indistinguishable on a slow breath; 1 = old chatty behaviour.
step = 4

# period: seconds per cycle (breathing / heartbeat)
period = 6.0

# open_level: backlight while the LID IS OPEN (maintenance).
# The pulse pauses and the screen sits at this level so it's readable.
open_level = 60
